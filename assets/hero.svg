<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Terminal: dejaspawn drill --dry-run restores Stripe into a mock, rehearses the Cloudflare import, checks the GitHub mirror, total 0.006 min, then verify prints OK">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0F3A"/><stop offset="1" stop-color="#0E1B3D"/></linearGradient>
  </defs>
  <style>
    .t{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D8DEE9}
    .p{fill:#7DF9FF}.k{fill:#FFB547}.ok{fill:#5BE3AE;font-weight:700}.dim{fill:#8B93A7}.m{fill:#FF5FA2}
  </style>
  <rect width="880" height="330" rx="16" fill="url(#g)"/>
  <circle cx="26" cy="24" r="6" fill="#FF5F57"/><circle cx="46" cy="24" r="6" fill="#FEBC2E"/><circle cx="66" cy="24" r="6" fill="#28C840"/>
  <text x="440" y="29" text-anchor="middle" class="t dim">examples/drill_transcript.txt</text>
  <text x="28" y="72" class="t"><tspan class="p">$</tspan> python -m dejaspawn drill --dry-run</text>
  <text x="28" y="102" class="t"><tspan class="k">stripe    </tspan>  <tspan class="m">MOCK   </tspan>  0.002 min  restored: customers 1, products 1, prices 1, subscriptions 1</text>
  <text x="28" y="128" class="t"><tspan class="k">cloudflare</tspan>  <tspan class="m">DRY-RUN</tspan>  0.000 min  zone example.test: 5 records, request written, not sent</text>
  <text x="28" y="154" class="t"><tspan class="k">github    </tspan>  <tspan class="m">REAL   </tspan>  0.003 min  stillherd.git: ok</text>
  <text x="28" y="180" class="t"><tspan class="k">total     </tspan>             0.006 min</text>
  <text x="28" y="206" class="t dim">receipt: receipts/20261108T174645Z-drill.json</text>
  <text x="28" y="250" class="t"><tspan class="p">$</tspan> python -m dejaspawn verify examples/drill_receipt_mock_dejaspawn.json</text>
  <text x="28" y="278" class="t ok">OK</text>
  <text x="852" y="312" text-anchor="end" class="t dim">output abridged from the committed transcript</text>
</svg>
